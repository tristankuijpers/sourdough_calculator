<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="sdFaviconStarterGradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e7ba52"/>
      <stop offset="100%" stop-color="#c67b2e"/>
    </linearGradient>
    <filter id="sdFaviconJarShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#0a0600" flood-opacity="0.55"/>
    </filter>
  </defs>

  <!-- Full-bleed background for maskable icon -->
  <rect width="1024" height="1024" fill="#2a1d11"/>

  <!-- Jar fits within inner safe zone (~204px margin each side) -->
  <!-- scale and translate so jar occupies 614px width centered -->
  <g transform="translate(205 108) scale(0.6)" filter="url(#sdFaviconJarShadow)">

    <!-- Cork lid -->
    <rect x="130" y="0" width="740" height="148" rx="74" fill="#c9a96e"/>
    <rect x="148" y="12" width="704" height="124" rx="62" fill="#d4b47a"/>
    <line x1="200" y1="30" x2="200" y2="118" stroke="#b8924a" stroke-width="6" opacity="0.5"/>
    <line x1="300" y1="22" x2="300" y2="126" stroke="#b8924a" stroke-width="6" opacity="0.5"/>
    <line x1="400" y1="18" x2="400" y2="130" stroke="#c09a52" stroke-width="4" opacity="0.4"/>
    <line x1="500" y1="18" x2="500" y2="130" stroke="#b8924a" stroke-width="6" opacity="0.5"/>
    <line x1="600" y1="22" x2="600" y2="126" stroke="#b8924a" stroke-width="4" opacity="0.4"/>
    <line x1="700" y1="30" x2="700" y2="118" stroke="#b8924a" stroke-width="6" opacity="0.5"/>
    <rect x="148" y="12" width="704" height="38" rx="62" fill="white" opacity="0.12"/>

    <!-- Wire bale -->
    <rect x="370" y="-28" width="260" height="26" rx="13" fill="#aaa090" stroke="#888070" stroke-width="4"/>
    <path d="M390 -15 Q360 80 310 148 Q280 200 280 280" stroke="#aaa090" stroke-width="14" fill="none" stroke-linecap="round"/>
    <path d="M610 -15 Q640 80 690 148 Q720 200 720 280" stroke="#aaa090" stroke-width="14" fill="none" stroke-linecap="round"/>

    <!-- Jar neck ring -->
    <rect x="200" y="148" width="600" height="36" rx="0" fill="#b8b0a0"/>
    <rect x="200" y="148" width="600" height="12" fill="#cfc7b7"/>

    <!-- Jar body -->
    <rect x="180" y="184" width="640" height="36" rx="0" fill="#a8a098"/>
    <path d="M200 220 h600 v460 a80 80 0 0 1-80 80 H280 a80 80 0 0 1-80-80 Z" fill="#9c9488"/>

    <!-- Starter fill -->
    <clipPath id="jarClipM">
      <path d="M200 220 h600 v460 a80 80 0 0 1-80 80 H280 a80 80 0 0 1-80-80 Z"/>
    </clipPath>
    <g clip-path="url(#jarClipM)">
      <rect x="200" y="380" width="600" height="380" fill="#c67b2e"/>
      <path d="M200 380 q80-55 160-10 q80 55 160 0 q80-55 160-10 q40 27 80 10 v40 q-40 17-80-10 q-80-55-160 10 q-80 55-160 0 q-80-45-160 10 Z" fill="#e7ba52"/>
      <ellipse cx="310" cy="395" rx="28" ry="14" fill="#f0c860" opacity="0.6"/>
      <ellipse cx="520" cy="385" rx="22" ry="10" fill="#f0c860" opacity="0.5"/>
      <ellipse cx="680" cy="398" rx="18" ry="9" fill="#e8b84e" opacity="0.5"/>
      <circle cx="280" cy="500" r="22" fill="#e9bd57" opacity="0.22"/>
      <circle cx="470" cy="540" r="28" fill="#ebc25a" opacity="0.22"/>
      <circle cx="640" cy="510" r="18" fill="#ebc25a" opacity="0.22"/>
      <circle cx="370" cy="620" r="24" fill="#ebc25a" opacity="0.22"/>
      <circle cx="570" cy="660" r="20" fill="#ebc25a" opacity="0.22"/>
      <rect x="200" y="380" width="30" height="380" fill="white" opacity="0.08"/>
      <rect x="770" y="380" width="30" height="380" fill="white" opacity="0.06"/>
    </g>

    <!-- Glass reflections -->
    <rect x="200" y="220" width="30" height="460" fill="white" opacity="0.1"/>
    <rect x="770" y="220" width="30" height="460" fill="white" opacity="0.07"/>
    <path d="M210 230 Q220 300 210 400" stroke="white" stroke-width="16" fill="none" opacity="0.13" stroke-linecap="round"/>
  </g>
</svg>
