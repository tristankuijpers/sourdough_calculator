<script>
// Localize the product list for this page load *before* the app boots:
// pLocal() swaps every shared string for the active language (labels, chips,
// comingSoon) while leaving ratios/limits untouched.
//
// NB: `const PRODUCTS` in products.js is a global lexical binding and cannot
// be reassigned (so no `PRODUCTS = PRODUCTS.map(...)` here). Mutate the array
// in place instead, so every later reference to the bare identifier sees the
// localized items.
PRODUCTS.forEach(function (raw, i) {
  PRODUCTS[i] = window.pLocal(raw, I18N.lang());
});
</script>
<script>
// ---------- core baker's-percentage math ----------
// F = total flour, W = total dough weight, all percentages are fractions of F.
// hydration h, starter s, salt sp, oil o (0 for bread).
function computeDough(W, h, s, sp, o){
  const F = W / (1 + h + sp + o);
  return { starter:s*F, flour:F*(1-0.5*s), water:F*(h-0.5*s), salt:sp*F, oil:o*F, totalFlour:F };
}
const round = n => Math.round(n);

function renderRows(container, items){
  container.innerHTML = items.map(it => `
    <div class="row">
      <div><span class="name">${it.name}</span><span class="pct">${it.pctLabel}</span></div>
      <div class="amt">${round(it.grams)}<span>g</span></div>
    </div>`).join('');
}

// persistence helpers (localStorage, "sd_" prefix)
function restoreValue(el){ const v = localStorage.getItem('sd_' + el.id); if (v !== null) el.value = v; }
function persistValue(el){ localStorage.setItem('sd_' + el.id, el.value); }

const $ = id => document.getElementById(id);
// session-only UI mode per product: "base" (chips scale the default portion) or "percent"
const baseMode = {};
// Active tab lives in the URL hash (#bread / #pizza / #focaccia) so reloads —
// e.g. the language toggle, which reloads the page — land back on the same
// product instead of resetting to the first one. Falls back to the first
// enabled product when no (valid) hash is present.
const defaultId = PRODUCTS.find(p => !p.disabled) ? PRODUCTS.find(p => !p.disabled).id : null;
const hashId = location.hash.length > 1 ? location.hash.slice(1) : null;
const activeId = (hashId && PRODUCTS.find(p => p.id === hashId && !p.disabled))
  ? hashId
  : defaultId;

// scale a base portion (grams) up/down to a new total dough weight
function scaleBase(base, W){
  const k = W / base.total;
  return {
    starter: base.starter * k,
    flour:   base.flour   * k,
    water:   base.water   * k,
    salt:    base.salt    * k,
    oil:     (base.oil || 0) * k,
    totalFlour: (base.flour + base.starter / 2) * k
  };
}

// The one update function every product shares.
function updateProduct(p){
  const pid = p.id;
  const W  = parseFloat($(pid+'-weight').value);
  const h  = parseFloat($(pid+'-hydration').value) / 100;
  const st = p.advanced.starter.def / 100;
  const sp = p.advanced.salt / 100;
  const os = p.advanced.extras.map(ex => parseFloat($(pid+'-'+ex.key).value));
  const o  = os.reduce((a,b)=>a+b,0) / 100;

  $(pid+'-weight-num').textContent  = round(W);
  $(pid+'-hydration-v').textContent = Math.round(h*100)+'%';
  p.advanced.extras.forEach((ex,i) => { $(pid+'-'+ex.key+'-v').textContent = Math.round(os[i])+'%'; });

  const d = (p.chipsSwitchTo === 'base' && baseMode[pid] === 'base' && p.base)
    ? scaleBase(p.base, W)
    : computeDough(W, h, st, sp, o);

  // Every ingredient is annotated with its baker's percentage of the total
  // flour (grams shown ÷ total flour incl. starter). The hydration itself is
  // shown elsewhere, so it does not appear in the rows.
  const ann = t => Math.round(t*100)+'% '+I18N.t('pctOfFlour');
  const rows = [
    {name:I18N.t('ing_starter'), pctLabel:ann(d.starter/d.totalFlour), grams:d.starter},
    {name:I18N.t('ing_flour'),   pctLabel:ann(d.flour/d.totalFlour),   grams:d.flour},
    {name:I18N.t('ing_water'),   pctLabel:ann(d.water/d.totalFlour),   grams:d.water},
    ...p.advanced.extras.map((ex,i) => ({name:ex.name, pctLabel:ann(d.oil/d.totalFlour), grams:d.oil})),
    {name:I18N.t('ing_salt'),    pctLabel:ann(d.salt/d.totalFlour),    grams:d.salt},
  ];
  renderRows($(pid+'-rows'), rows);

  // dough-ball counter (pizza widget); helper line always shows total flour
  if (p.widget && p.widget.type === 'balls'){
    const bw = parseFloat($(pid+'-ball-weight').value) || p.widget.defaultBallWeight;
    $(pid+'-ball-count').textContent = Math.round(W / bw);
  }
  $(pid+'-helper').innerHTML = I18N.t('helperTotalFlour', round(d.totalFlour));

  // chip active state
  [...$(pid+'-chips').children].forEach(c => {
    const n = parseInt(c.dataset.balls, 10);
    const ok = isNaN(n)
      ? Math.abs(parseFloat(c.dataset.v) - W) < 1
      : Math.abs(W - p.base.total * n / p.widget.defaultCount) < 1;
    c.classList.toggle('active', ok);
  });
}
// ---- builders -----------------------------------------------------------

function tabHTML(p){
  const soon = p.disabled ? ' tab-soon' : '';
  const active = p.id === activeId ? ' active' : '';
  const emoji = p.emoji ? p.emoji+' ' : '';
  const tag = p.tag ? `<span class="tag">${p.tag}</span>` : '';
  return `<div class="tab${soon}${active}" data-tab="${p.id}" style="--accent-soft:${p.accent.soft}; --accent-ring:${p.accent.ring};">${emoji}${p.label}${tag}</div>`;
}

function chipHTML(c){
  if (c.balls !== undefined) return `<button class="chip" data-balls="${c.balls}">${c.text}</button>`;
  return `<button class="chip" data-v="${c.weight}">${c.text}</button>`;
}

function advRowHTML(pid, cfg){
  if (!cfg) return '';
  return `
    <div class="adv-row">
      <div class="top"><span class="k">${cfg.label}</span><span class="v" id="${pid}-${cfg.key}-v">${Math.round(cfg.def)}%</span></div>
      <input type="range" id="${pid}-${cfg.key}" min="${cfg.min}" max="${cfg.max}" step="${cfg.step}" value="${cfg.def}">
    </div>`;
}

function calcPanelHTML(p){
  const pid = p.id, s = p.slider;
  const ballWidget = (p.widget && p.widget.type === 'balls') ? `
    <div class="helper-line" style="margin-top:10px;">
      ≈ <b id="${pid}-ball-count">${p.widget.defaultCount}</b> ${I18N.t('doneBalls')}
      <input class="ball-input" id="${pid}-ball-weight" type="text" inputmode="decimal" value="${p.widget.defaultBallWeight}"> g
    </div>` : '';
  const helper = `<div class="helper-line" id="${pid}-helper"></div>`;
  const adv = [
    advRowHTML(pid, p.advanced.hydration),
    ...p.advanced.extras.map(ex => advRowHTML(pid, ex))
  ].join('');
  return `
      <div class="weight-block">
        <div class="weight-label">${I18N.t('totalDough')}</div>
        <div class="weight-value"><span id="${pid}-weight-num">${s.def}</span><span>g</span></div>
        <input type="range" id="${pid}-weight" min="${s.min}" max="${s.max}" step="${s.step}" value="${s.def}">
        <div class="range-minmax"><span>${s.min} g</span><span>${s.max} g</span></div>
      </div>
      ${ballWidget}
      <div class="chips" id="${pid}-chips"></div>

      <div class="divider">
        <svg width="20" height="12" viewBox="0 0 20 12"><path d="M1 10 L7 2 M8 10 L14 2 M15 10 L19 4" stroke="var(--accent, var(--amber))" stroke-width="1.4" fill="none" stroke-linecap="round"/></svg>
        <div class="line"></div>
        <span style="font-family:'IBM Plex Mono',monospace; font-size:10px; letter-spacing:0.1em;">${I18N.t('ingredients')}</span>
        <div class="line"></div>
      </div>

      <div class="rows" id="${pid}-rows"></div>

      ${helper}

      <div class="recipe-link"><a class="chip" href="recipes/recipe.html?product=${pid}">${I18N.t('recipeMethod')}</a></div>

      <!-- Advanced toggle: the hydration slider keeps the total dough weight
           fixed and re-derives flour, starter & salt from it. -->
      <details class="adv-panel">
        <summary>${I18N.t('advanced')}</summary>
        <div class="adv-grid">
          ${adv}
        </div>
        <div class="adv-reset"><button type="button" class="chip" id="${pid}-reset">${I18N.t('resetDefaults')}</button></div>
      </details>`;
}

function panelHTML(p){
  const active = p.id === activeId ? ' active' : '';
  const card = p.disabled
    ? `<div class="card"><div class="coming-soon"><div class="big">${p.emoji} ${p.label}</div><p>${p.comingSoon}</p></div></div>`
    : `<div class="card">${calcPanelHTML(p)}</div>`;
  return `<div class="tabpanel${active}" id="panel-${p.id}" style="--accent:${p.accent.color}">${card}</div>`;
}

// ---- render ----
$('tabs').innerHTML = PRODUCTS.map(tabHTML).join('');
$('panels').innerHTML = PRODUCTS.map(panelHTML).join('');

// wire up each enabled product
PRODUCTS.forEach(p => {
  if (p.disabled) return;
  const pid = p.id;
  baseMode[pid] = p.chipsSwitchTo;

  // persistence: seed ratio slider defaults, then restore any saved values.
  // (Weight is intentionally never restored — every product opens on its
  // default portion.)
  [p.advanced.hydration, ...p.advanced.extras]
    .forEach(cfg => { $(pid+'-'+cfg.key).value = cfg.def; });
  [p.advanced.hydration, ...p.advanced.extras]
    .forEach(cfg => restoreValue($(pid+'-'+cfg.key)));

  $(pid+'-chips').innerHTML = p.chips.map(chipHTML).join('');

  // chips (presets): snap to a new weight but KEEP the current mode, so a
  // hydration slider the user already moved keeps applying to the new weight
  // (base mode -> scaled base portion, percent mode -> baker's percentages).
  $(pid+'-chips').addEventListener('click', e => {
    const btn = e.target.closest('.chip'); if (!btn) return;
    const balls = parseInt(btn.dataset.balls, 10);
    $(pid+'-weight').value = isNaN(balls)
      ? parseFloat(btn.dataset.v)
      : p.base.total * balls / p.widget.defaultCount;
    persistValue($(pid+'-weight'));
    updateProduct(p);
  });

  // total-dough weight slider (keeps current mode; never restored on load)
  $(pid+'-weight').addEventListener('input', () => {
    persistValue($(pid+'-weight'));
    updateProduct(p);
  });

  // ball-weight input (pizza): rounds to 0.5 g, stays in current mode
  if (p.widget && p.widget.type === 'balls'){
    $(pid+'-ball-weight').addEventListener('input', () => {
      $(pid+'-ball-weight').value = Math.round((parseFloat($(pid+'-ball-weight').value) || p.widget.defaultBallWeight) * 2) / 2;
      persistValue($(pid+'-ball-weight'));
      updateProduct(p);
    });
  }

  // ratio sliders switch bread/pizza from base mode into percentage mode
  [p.advanced.hydration, ...p.advanced.extras].forEach(cfg => {
    const el = $(pid+'-'+cfg.key);
    el.addEventListener('input', () => {
      if (p.chipsSwitchTo === 'base') baseMode[pid] = 'percent';
      persistValue(el);
      updateProduct(p);
    });
  });

  // reset-to-defaults
  $(pid+'-reset').addEventListener('click', () => {
    baseMode[pid] = p.chipsSwitchTo;
    if (p.resetWeight) {
      $(pid+'-weight').value = p.slider.def;
      persistValue($(pid+'-weight'));
    }
    if (p.widget && p.widget.type === 'balls') $(pid+'-ball-weight').value = p.widget.defaultBallWeight;
    [p.advanced.hydration, ...p.advanced.extras].forEach(cfg => {
      $(pid+'-'+cfg.key).value = cfg.def;
      persistValue($(pid+'-'+cfg.key));
    });
    updateProduct(p);
  });

  updateProduct(p);
});

// ---------- share ----------
const shareToast = document.getElementById('share-toast');
const shareAppBtn = document.getElementById('share-app');
function showToast(msg){
  shareToast.textContent = msg;
  shareToast.classList.add('show');
  if (shareToast._t) clearTimeout(shareToast._t);
  shareToast._t = setTimeout(()=>shareToast.classList.remove('show'), 2200);
}
function isSmartphone(){
  const ua = navigator.userAgent || '';
  const mobilePhoneUA = /Android|iPhone|iPad|iPod|Windows Phone|Mobile/i.test(ua);
  const hasCoarsePointer = window.matchMedia && window.matchMedia('(pointer: coarse)').matches;
  const narrowViewport = window.matchMedia && window.matchMedia('(max-width: 900px)').matches;
  // Any one signal is enough: some phones/iPads/webviews don't report all of them.
  return mobilePhoneUA || hasCoarsePointer || narrowViewport;
}

// Share only where the native share sheet can work. If navigator.share is missing
// the button is hidden (no WhatsApp-style fallbacks; opting out is a clean no).
const enableNativeShare = isSmartphone() && !!navigator.share;
if (!enableNativeShare){
  shareAppBtn.style.display = 'none';
} else {
  shareAppBtn.addEventListener('click', async ()=>{
    if (!navigator.share){
      showToast(I18N.t('shareUnavailable'));
      return;
    }

    const url = location.href.split('#')[0];
    const text = I18N.t('shareText');

    try {
      await navigator.share({ title:I18N.t('shareTitle'), text, url });
    } catch (err) {
      // Dismissing the share sheet (AbortError) is a normal no-op.
      // Never open fallback channels (e.g. WhatsApp) on cancel or failure.
      if (err && err.name === 'AbortError') return;
      showToast(I18N.t('shareFailed'));
    }
  });
}

// ---------- tabs ----------
document.querySelectorAll('.tab').forEach(tab=>{
  tab.addEventListener('click', ()=>{
    document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
    document.querySelectorAll('.tabpanel').forEach(p=>p.classList.remove('active'));
    tab.classList.add('active');
    document.getElementById('panel-'+tab.dataset.tab).classList.add('active');
    tab.scrollIntoView({block:'nearest', inline:'nearest', behavior:'smooth'});
    // Keep the URL hash in sync, so any reload (e.g. the language toggle) restores
    // this tab rather than falling back to the first product. Disabled ("soon")
    // tabs are placeholders, so they never drive the persisted tab.
    if (!tab.classList.contains('tab-soon')) {
      try { history.replaceState(null, '', '#' + tab.dataset.tab); } catch (e) {}
    }
  });
});

// only show the edge fades on the tab strip when there's more to scroll to
const tabsWrap = document.querySelector('.tabs-wrap');
const tabsEl = document.querySelector('.tabs');
function updateTabFades(){
  const canLeft = tabsEl.scrollLeft > 2;
  const canRight = tabsEl.scrollLeft + tabsEl.clientWidth < tabsEl.scrollWidth - 2;
  tabsWrap.classList.toggle('can-scroll-left', canLeft);
  tabsWrap.classList.toggle('can-scroll-right', canRight);
}
tabsEl.addEventListener('scroll', updateTabFades);
window.addEventListener('resize', updateTabFades);
updateTabFades();

// ---------- i18n boot ----------
// Static [data-i18n] markup, <title> and meta description follow the active
// language; the lang-chip toggles en <-> nl (persisted in localStorage).
document.documentElement.lang = I18N.lang();
document.title = I18N.t('title');
var metaDescEl = document.querySelector('meta[name="description"]');
if (metaDescEl) metaDescEl.setAttribute('content', I18N.t('metaDesc'));
I18N.apply(document);
I18N.wireFlags(document);

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js'));
}
</script>
