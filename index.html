<script>
// Localize the product list for this page load *before* the app boots:
// pLocal() swaps every shared string for the active language (labels, chips,
// comingSoon) while leaving ratios/limits untouched.
//
// NB: `const PRODUCTS` in products.js is a global lexical binding and cannot
// be reassigned (so no `PRODUCTS = PRODUCTS.map(...)` here). Mutate the array
// in place instead, so every later reference to the bare identifier sees the
// localized items.
PRODUCTS.forEach(function (raw, i) {
  PRODUCTS[i] = window.pLocal(raw, I18N.lang());
});
</script>
<script>
// ---------- core baker's-percentage math ----------
// F = total flour, W = total dough weight, all percentages are fractions of F.
// hydration h, starter s, salt sp, oil o (0 for bread).
function computeDough(W, h, s, sp, o){
  const F = W / (1 + h + sp + o);
  return { starter:s*F, flour:F*(1-0.5*s), water:F*(h-0.5*s), salt:sp*F, oil:o*F, totalFlour:F };
}
const round = n => Math.round(n);

function renderRows(container, items, editable){
  container.innerHTML = items.map(it => `
    <div class="row">
      <div><span class="name">${it.name}</span><span class="pct">${it.pctLabel}</span></div>
      <div class="amt${editable ? ' editable' : ''}"${it.key ? ` data-key="${it.key}"` : ''}${editable ? ` title="${I18N.t('editIngredient')}"` : ''}>${round(it.grams)}<span>g</span></div>
    </div>`).join('');
}

// persistence helpers (localStorage, "sd_" prefix)
function restoreValue(el){ const v = localStorage.getItem('sd_' + el.id); if (v !== null) el.value = v; }
function persistValue(el){ localStorage.setItem('sd_' + el.id, el.value); }

const $ = id => document.getElementById(id);
// session-only UI mode per product: "base" (chips scale the default portion) or "percent"
const baseMode = {};
// editable products (custom) keep a mutable working base in grams; the weight
// slider scales it, ingredient-row edits replace parts of it and ratio-slider
// moves recompute it from the baker's percentages
const dynBase = {};
// Active tab lives in the URL hash (#bread / #pizza / #focaccia) so reloads —
// e.g. the language toggle, which reloads the page — land back on the same
// product instead of resetting to the first one. Falls back to the first
// enabled product when no (valid) hash is present.
const defaultId = PRODUCTS.find(p => !p.disabled) ? PRODUCTS.find(p => !p.disabled).id : null;
const hashId = location.hash.length > 1 ? location.hash.slice(1) : null;
const activeId = (hashId && PRODUCTS.find(p => p.id === hashId && !p.disabled))
  ? hashId
  : defaultId;

// every adjustable ratio-slider config of a product: hydration, starter, then
// any extras (salt has no slider; it stays a fixed % of total flour)
function advCfgs(p){
  return [p.advanced.hydration, p.advanced.starter, ...p.advanced.extras].filter(Boolean);
}

// scale a base portion (grams) up/down to a new total dough weight
function scaleBase(base, W){
  const k = W / base.total;
  return {
    starter: base.starter * k,
    flour:   base.flour   * k,
    water:   base.water   * k,
    salt:    base.salt    * k,
    oil:     (base.oil || 0) * k,
    totalFlour: (base.flour + base.starter / 2) * k
  };
}

// read the current baker's percentages off a product's sliders
function currentPcts(p){
  const pid = p.id;
  const h  = parseFloat($(pid+'-hydration').value) / 100;
  const st = parseFloat($(pid+'-starter').value) / 100;
  const sp = (p.advanced.salt || 0) / 100;   // salt is always a fixed % (no salt slider)
  const os = p.advanced.extras.map(ex => parseFloat($(pid+'-'+ex.key).value));
  // fixed oil % (custom) joins any extra %'s (e.g. pizza/focaccia oil slider)
  const o  = (p.advanced.oil || 0) / 100 + os.reduce((a,b)=>a+b,0) / 100;
  return { h, st, sp, os, o };
}

// The one update function every product shares.
function updateProduct(p){
  const pid = p.id;
  const W  = parseFloat($(pid+'-weight').value);
  const { h, st, sp, os, o } = currentPcts(p);
  // editable product with no ingredients yet (all grams still 0): show a blank
  // slate so the user knows to fill in every ingredient themselves — and skip
  // any scaling/percentage math that would otherwise divide by total flour 0
  const empty = p.editableIngredients && dynBase[pid] && dynBase[pid].total <= 0;

  $(pid+'-weight-num').textContent  = round(W);
  $(pid+'-hydration-v').textContent = Math.round(h*100)+'%';
  $(pid+'-starter-v').textContent   = Math.round(st*100)+'%';
  p.advanced.extras.forEach((ex,i) => { $(pid+'-'+ex.key+'-v').textContent = Math.round(os[i])+'%'; });

  // base mode scales the product's working base (default portion, or the
  // custom product's user-edited ingredient grams) to the chosen weight;
  // otherwise the baker's percentages drive the rows.
  // editable products (custom) always scale from their working gram base, so
  // the weight slider keeps scaling exactly the ingredients the user entered;
  // bread/pizza use their base/percent mode as before
  const inBase = p.editableIngredients
    ? (dynBase[pid] || p.base)
    : (p.chipsSwitchTo === 'base' && baseMode[pid] === 'base' && (dynBase[pid] || p.base));
  const d = empty
    ? { starter:0, flour:0, water:0, salt:0, oil:0, totalFlour:0 }
    : (inBase ? scaleBase(inBase, W) : computeDough(W, h, st, sp, o));
  const k = (empty || !inBase) ? 1 : W / inBase.total;

  // Every ingredient is annotated with its baker's percentage of the total
  // flour (grams shown ÷ total flour incl. starter). The hydration itself is
  // shown elsewhere, so it does not appear in the rows.
  const ann = t => isFinite(t) ? Math.round(t*100)+'% '+I18N.t('pctOfFlour') : '';
  const rows = [
    {key:'starter', name:I18N.t('ing_starter'), pctLabel:ann(d.starter/d.totalFlour), grams:d.starter},
    {key:'flour',   name:I18N.t('ing_flour'),   pctLabel:ann(d.flour/d.totalFlour),   grams:d.flour},
    {key:'water',   name:I18N.t('ing_water'),   pctLabel:ann(d.water/d.totalFlour),   grams:d.water},
  // each extra ingredient gets its own grams from its own % of total flour
    ...p.advanced.extras.map((ex,i) => ({
      key: ex.key,
      name: ex.name,
      pctLabel: ann(empty ? NaN : (inBase ? (inBase[ex.key]*k)/d.totalFlour : os[i]/100)),
      grams: empty ? 0 : (inBase ? inBase[ex.key]*k : os[i]/100*d.totalFlour)
    })),
    // fixed oil ingredient (custom): its own editable row like salt, no slider
    ...(p.advanced.oil ? [{
      key: 'oil', name: I18N.t('ing_oil'),
      pctLabel: ann(d.oil/d.totalFlour), grams: d.oil
    }] : []),
    {key:'salt',    name:I18N.t('ing_salt'),    pctLabel:ann(d.salt/d.totalFlour),    grams:d.salt},
  ];
  renderRows($(pid+'-rows'), rows, !!p.editableIngredients);

  // the ratio sliders have nothing to tune against while the ingredient rows
  // are still empty — disable them until the user enters an ingredient (they
  // show their defaults, but can't move). This avoids a confusing 0/0 state.
  advCfgs(p).forEach(cfg => { const el = $(pid+'-'+cfg.key); if (el) el.disabled = empty; });

  // dough-ball counter (pizza widget); helper line always shows total flour
  if (p.widget && p.widget.type === 'balls'){
    const bw = parseFloat($(pid+'-ball-weight').value) || p.widget.defaultBallWeight;
    $(pid+'-ball-count').textContent = Math.round(W / bw);
  }
  $(pid+'-helper').innerHTML = empty
    ? I18N.t('editHint')
    : I18N.t('helperTotalFlour', round(d.totalFlour));

  // chip active state
  [...$(pid+'-chips').children].forEach(c => {
    const n = parseInt(c.dataset.balls, 10);
    const ok = isNaN(n)
      ? Math.abs(parseFloat(c.dataset.v) - W) < 1
      : Math.abs(W - p.base.total * n / p.widget.defaultCount) < 1;
    c.classList.toggle('active', ok);
  });
}
// re-derive the ratio sliders from a working base (grams), clamped to the
// sliders' ranges. h = (water + starter/2) / F, s = starter / F, etc., where
// F = total flour incl. starter (flour + starter/2).
function syncRatioSliders(p, b){
  const pid = p.id;
  const F = b.flour + b.starter / 2;
  if (F <= 0) return;
  const set = (cfg, pct) => {
    if (!cfg) return;
    const el = $(pid+'-'+cfg.key);
    // every product (incl. custom) has a starter slider to sync to; only guard
    // against a missing element just in case
    if (!el) return;
    el.value = Math.min(cfg.max, Math.max(cfg.min, pct));
    persistValue(el);
  };
  set(p.advanced.hydration, (b.water + b.starter / 2) / F * 100);
  set(p.advanced.starter,   b.starter / F * 100);   // starter has a slider now; sync it
  p.advanced.extras.forEach(ex => set(ex, (b[ex.key] || 0) / F * 100));
}

// editable ingredient rows (custom): the typed grams replace that ingredient
// at the CURRENT dough weight; every other ingredient keeps its grams, the
// weight slider snaps to the new total and the ratio sliders re-derive. From
// then on the weight slider scales exactly these ingredient grams.
function editIngredient(p, key, grams){
  const pid = p.id;
  const b = dynBase[pid];
  const W = parseFloat($(pid+'-weight').value);
  const k = b.total ? W / b.total : 1;   // base grams -> grams at current weight
  const nb = {
    starter: b.starter * k,
    flour:   b.flour   * k,
    water:   b.water   * k,
    salt:    b.salt    * k,
    oil:     (b.oil || 0) * k
  };
  p.advanced.extras.forEach(ex => { if (nb[ex.key] === undefined) nb[ex.key] = (b[ex.key] || 0) * k; });
  nb[key] = grams;
  nb.total = nb.starter + nb.flour + nb.water + nb.salt +
    Object.keys(nb).filter(kk => !['starter','flour','water','salt','total'].includes(kk)).reduce((a,kk)=>a+nb[kk],0);
  dynBase[pid] = nb;
  syncRatioSliders(p, nb);
  $(pid+'-weight').value = Math.max(p.slider.min, Math.min(p.slider.max, Math.round(nb.total)));
  persistValue($(pid+'-weight'));
  unlightStarOn(pid);
  updateProduct(p);
}

// ---- builders -----------------------------------------------------------

function tabHTML(p){
  const soon = p.disabled ? ' tab-soon' : '';
  const active = p.id === activeId ? ' active' : '';
  const emoji = p.emoji ? p.emoji+' ' : '';
  const tag = p.tag ? `<span class="tag">${p.tag}</span>` : '';
  return `<div class="tab${soon}${active}" data-tab="${p.id}" style="--accent-soft:${p.accent.soft}; --accent-ring:${p.accent.ring};">${emoji}${p.label}${tag}</div>`;
}

function chipHTML(c){
  if (c.balls !== undefined) return `<button class="chip" data-balls="${c.balls}">${c.text}</button>`;
  return `<button class="chip" data-v="${c.weight}">${c.text}</button>`;
}

function advRowHTML(pid, cfg){
  if (!cfg) return '';
  return `
    <div class="adv-row">
      <div class="top"><span class="k">${cfg.label}</span><span class="v" id="${pid}-${cfg.key}-v">${Math.round(cfg.def)}%</span></div>
      <input type="range" id="${pid}-${cfg.key}" min="${cfg.min}" max="${cfg.max}" step="${cfg.step}" value="${cfg.def}">
    </div>`;
}

function calcPanelHTML(p){
  const pid = p.id, s = p.slider;
  const ballWidget = (p.widget && p.widget.type === 'balls') ? `
    <div class="helper-line" style="margin-top:10px;">
      ≈ <b id="${pid}-ball-count">${p.widget.defaultCount}</b> ${I18N.t('doneBalls')}
      <input class="ball-input" id="${pid}-ball-weight" type="text" inputmode="decimal" value="${p.widget.defaultBallWeight}"> g
    </div>` : '';
  const helper = `<div class="helper-line" id="${pid}-helper"></div>`;
  const adv = advCfgs(p).map(cfg => advRowHTML(pid, cfg)).join('');
  return `
      <button type="button" class="reset-icon" id="${pid}-reset-icon" title="${I18N.t('resetIcon')}" aria-label="${I18N.t('resetIcon')}">
        <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.34-5.66" stroke="currentColor" stroke-width="1.8" fill="none" stroke-linecap="round"/>
        <path d="M20 3v4h-4" stroke="currentColor" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <button type="button" class="fav-star" id="${pid}-fav-star" title="${I18N.t('saveToFavorites')}" aria-label="${I18N.t('saveToFavorites')}">
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M12 2.6l2.9 5.9 6.5 0.9-4.7 4.6 1.1 6.5L12 17.4l-5.8 3.1 1.1-6.5L2.6 9.4l6.5-0.9z"/></svg>
      </button>
      <div class="weight-block">
        <div class="weight-label">${I18N.t('totalDough')}</div>
        <div class="weight-value"><span id="${pid}-weight-num">${s.def}</span><span>g</span></div>
        <input type="range" id="${pid}-weight" min="${s.min}" max="${s.max}" step="${s.step}" value="${s.def}">
        <div class="range-minmax"><span>${s.min} g</span><span>${s.max} g</span></div>
      </div>
      ${ballWidget}
      <div class="chips" id="${pid}-chips"></div>

      <div class="divider">
        <svg width="20" height="12" viewBox="0 0 20 12"><path d="M1 10 L7 2 M8 10 L14 2 M15 10 L19 4" stroke="var(--accent, var(--amber))" stroke-width="1.4" fill="none" stroke-linecap="round"/></svg>
        <div class="line"></div>
        <span style="font-family:'IBM Plex Mono',monospace; font-size:10px; letter-spacing:0.1em;">${I18N.t(p.editableIngredients ? 'ingredientsEdit' : 'ingredients')}</span>
        <div class="line"></div>
      </div>

      <div class="rows" id="${pid}-rows"></div>

      ${helper}

      <div class="recipe-link">${p.recipe
        ? `<a class="chip" href="recipes/recipe.html?product=${pid}">${I18N.t('recipeMethod')}</a>`
        : `<a class="chip" href="recipes/getting-started.html">${I18N.t('basicMethod')}</a>`}</div>

      <!-- Advanced toggle: the hydration slider keeps the total dough weight
           fixed and re-derives flour, starter & salt from it. -->
      <details class="adv-panel">
        <summary>${I18N.t('advanced')}</summary>
        <div class="adv-grid">
          ${adv}
        </div>
        <div class="adv-reset"><button type="button" class="chip" id="${pid}-reset">${I18N.t('resetDefaults')}</button></div>
      </details>`;
}

function panelHTML(p){
  const active = p.id === activeId ? ' active' : '';
  const card = p.disabled
    ? `<div class="card"><div class="coming-soon"><div class="big">${p.emoji} ${p.label}</div><p>${p.comingSoon}</p></div></div>`
    : `<div class="card">${calcPanelHTML(p)}</div>`;
  return `<div class="tabpanel${active}" id="panel-${p.id}" style="--accent:${p.accent.color}">${card}</div>`;
}

// ---- render ----
$('tabs').innerHTML = PRODUCTS.map(tabHTML).join('');
$('panels').innerHTML = PRODUCTS.map(panelHTML).join('');

// wire up each enabled product
PRODUCTS.forEach(p => {
  if (p.disabled) return;
  const pid = p.id;
  baseMode[pid] = p.chipsSwitchTo;
  // editable products work from a mutable copy of their default base
  if (p.editableIngredients) dynBase[pid] = Object.assign({}, p.base);

  // persistence: seed ratio slider defaults, then restore any saved values.
  // (Weight is intentionally never restored — every product opens on its
  // default portion.)
  advCfgs(p).forEach(cfg => { $(pid+'-'+cfg.key).value = cfg.def; });
  advCfgs(p).forEach(cfg => restoreValue($(pid+'-'+cfg.key)));

  $(pid+'-chips').innerHTML = p.chips.map(chipHTML).join('');

  // chips (presets): snap to a new weight but KEEP the current mode, so a
  // hydration slider the user already moved keeps applying to the new weight
  // (base mode -> scaled base portion, percent mode -> baker's percentages).
  $(pid+'-chips').addEventListener('click', e => {
    const btn = e.target.closest('.chip'); if (!btn) return;
    const balls = parseInt(btn.dataset.balls, 10);
    $(pid+'-weight').value = isNaN(balls)
      ? parseFloat(btn.dataset.v)
      : p.base.total * balls / p.widget.defaultCount;
    persistValue($(pid+'-weight'));
    unlightStarOn(pid);
    updateProduct(p);
  });

  // editable ingredient rows (custom): tap a gram amount to type a new one.
  // editIngredient() replaces that ingredient at the current weight, snaps the
  // weight slider to the new total and re-derives the ratio sliders.
  if (p.editableIngredients){
    $(pid+'-rows').addEventListener('click', e => {
      const amt = e.target.closest('.amt');
      if (!amt || !amt.dataset.key || amt.querySelector('input')) return;
      const key = amt.dataset.key;
      const cur = round(parseFloat($(pid+'-weight').value) / dynBase[pid].total * dynBase[pid][key]);
      amt.innerHTML = `<input class="amt-input" inputmode="decimal" value="${cur}">`;
      const inp = amt.querySelector('input');
      inp.focus(); inp.select();
      const commit = () => {
        let v = parseFloat(inp.value);
        if (isNaN(v) || v < 0) v = cur;
        editIngredient(p, key, v);
      };
      inp.addEventListener('blur', commit);
      inp.addEventListener('keydown', ev => {
        if (ev.key === 'Enter'){ ev.preventDefault(); inp.blur(); }
        if (ev.key === 'Escape'){ inp.value = cur; inp.blur(); }
      });
    });
  }

  // total-dough weight slider (keeps current mode; never restored on load)
  $(pid+'-weight').addEventListener('input', () => {
    persistValue($(pid+'-weight'));
    unlightStarOn(pid);
    updateProduct(p);
  });

  // ball-weight input (pizza): rounds to 0.5 g, stays in current mode
  if (p.widget && p.widget.type === 'balls'){
    $(pid+'-ball-weight').addEventListener('input', () => {
      $(pid+'-ball-weight').value = Math.round((parseFloat($(pid+'-ball-weight').value) || p.widget.defaultBallWeight) * 2) / 2;
      persistValue($(pid+'-ball-weight'));
      unlightStarOn(pid);
      updateProduct(p);
    });
  }

  // ratio sliders: on editable products (custom) they recompute the working
  // base from the percentages at the current weight; on bread/pizza they
  // switch from base mode into percentage mode
  advCfgs(p).forEach(cfg => {
    const el = $(pid+'-'+cfg.key);
    el.addEventListener('input', () => {
      if (p.editableIngredients){
        const W = parseFloat($(pid+'-weight').value);
        const b = dynBase[pid];
        const F = b ? b.flour + b.starter / 2 : 0;
        // no salt slider on custom: keep salt % from the working base, and read
        // the (possibly just-moved) hydration / starter / extra sliders
        const s  = parseFloat($(pid+'-starter').value) / 100;
        const sp = F ? b.salt / F : (p.advanced.salt || 0) / 100;
        const h  = parseFloat($(pid+'-hydration').value) / 100;
        const os = p.advanced.extras.map(ex => parseFloat($(pid+'-'+ex.key).value) / 100);
        // fixed oil % (custom) keeps its current share of the flour, like salt
        const o  = F ? (b.oil || 0) / F : (p.advanced.oil || 0) / 100 + os.reduce((a,x)=>a+x, 0);
        const d = computeDough(W, h, s, sp, o);
        const nb = { starter: d.starter, flour: d.flour, water: d.water, salt: d.salt, oil: d.oil };
        p.advanced.extras.forEach((ex,i) => { if (ex.key !== 'oil') nb[ex.key] = os[i]*d.totalFlour; });
        nb.total = W;
        dynBase[pid] = nb;
      } else if (p.chipsSwitchTo === 'base') baseMode[pid] = 'percent';
      persistValue(el);
      unlightStarOn(pid);
      updateProduct(p);
    });
  });

  // reset-to-defaults (top-left icon): full reset back to the default portion,
  // restoring the weight slider so the matching preset chip lights up again
  const resetProduct = () => {
    unlightStarOn(pid);
    baseMode[pid] = p.chipsSwitchTo;
    if (dynBase[pid]) dynBase[pid] = Object.assign({}, p.base);
    // restore the weight to the default portion so the matching preset chip
    // (e.g. "full loaf", "4 balls", "standard pan") lights back up
    $(pid+'-weight').value = p.slider.def;
    persistValue($(pid+'-weight'));
    if (p.widget && p.widget.type === 'balls') $(pid+'-ball-weight').value = p.widget.defaultBallWeight;
    advCfgs(p).forEach(cfg => {
      $(pid+'-'+cfg.key).value = cfg.def;
      persistValue($(pid+'-'+cfg.key));
    });
    updateProduct(p);
  };
  // Advanced-panel "reset": keep the user's total dough weight and only bring
  // the ratio sliders (hydration, extras/oil) back to their defaults
  const resetAdvanced = () => {
    unlightStarOn(pid);
    baseMode[pid] = p.chipsSwitchTo;
    if (dynBase[pid]) dynBase[pid] = Object.assign({}, p.base);
    advCfgs(p).forEach(cfg => {
      $(pid+'-'+cfg.key).value = cfg.def;
      persistValue($(pid+'-'+cfg.key));
    });
    updateProduct(p);
  };
  $(pid+'-reset-icon').addEventListener('click', resetProduct);
  $(pid+'-reset').addEventListener('click', resetAdvanced);

  updateProduct(p);
});

// ---------- favorites ----------
// A favorite pins a product together with the current slider values into
// localStorage ("sd_favorites"), under a user-chosen name. The Favorites pane
// (opened via the header chip) lists them and can load any of them back.
const FAV_KEY = 'sd_favorites';
const favOverlay = $('fav-overlay');
const favNameInput = $('fav-name-input');
favNameInput.placeholder = I18N.t('favNamePlaceholder');
let favEditProduct = null; // product object currently being pinned
// Which product's star is currently lit. Session-only: lit after saving via
// the star or loading a favorite; cleared as soon as the user navigates to
// another product tab (so returning shows an unlit star again).
let litFav = null;

function setStarLit(pid, lit){
  litFav = lit ? pid : null;
  const star = $(pid + '-fav-star');
  if (star) star.classList.toggle('faved', !!lit);
}

// changing any slider/reset on a product means the loaded/saved favorite no
// longer matches the current settings: extinguish its star
function unlightStarOn(pid){ if (litFav === pid) setStarLit(pid, false); }

function loadFavorites(){
  try {
    const v = JSON.parse(localStorage.getItem(FAV_KEY));
    return Array.isArray(v) ? v : [];
  } catch (e) { return []; }
}
function saveFavorites(list){
  try { localStorage.setItem(FAV_KEY, JSON.stringify(list)); }
  catch (e) { showToast(I18N.t('favoriteSaved') + ' (localStorage unavailable)'); }
}

// capture the full current slider state of a product panel
function captureProductState(p){
  const pid = p.id;
  const extras = {};
  advCfgs(p).forEach(cfg => {
    extras[cfg.key] = parseFloat($(pid + '-' + cfg.key).value);
  });
  return {
    weight: parseFloat($(pid + '-weight').value),
    extras: extras,
    ballWeight: (p.widget && p.widget.type === 'balls')
      ? parseFloat($(pid + '-ball-weight').value) || null
      : null,
    baseMode: baseMode[pid],
    // editable products: pin the working ingredient base too
    base: dynBase[pid] ? Object.assign({}, dynBase[pid]) : null
  };
}

// apply a saved state back onto a product's sliders and re-render
function applyProductState(p, fav){
  const pid = p.id;
  $(pid + '-weight').value = fav.weight;
  persistValue($(pid + '-weight'));
  if (fav.ballWeight != null && p.widget && p.widget.type === 'balls'){
    $(pid + '-ball-weight').value = fav.ballWeight;
    persistValue($(pid + '-ball-weight'));
  }
  Object.keys(fav.extras || {}).forEach(key => {
    const el = $(pid + '-' + key);
    if (el){ el.value = fav.extras[key]; persistValue(el); }
  });
  baseMode[pid] = fav.baseMode || p.chipsSwitchTo;
  if (fav.base && dynBase[pid]) dynBase[pid] = Object.assign({}, fav.base);
  updateProduct(p);
}

function escapeHTML(s){
  return String(s).replace(/[&<>"']/g, c => (
    { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]
  ));
}

function favSummary(p, fav){
  const bits = [round(fav.weight) + ' g'];
  const ingNames = { starter:'ing_starter', flour:'ing_flour', water:'ing_water', salt:'ing_salt', oil:'ing_oil' };
  Object.keys(fav.extras || {}).forEach(key => {
    if (key === 'hydration'){ bits.push(I18N.t('hydrationPct', round(fav.extras[key]))); return; }
    bits.push(round(fav.extras[key]) + '% ' + (ingNames[key] ? I18N.t(ingNames[key]) : key));
  });
  return bits.join(' \u00b7 ');
}

function renderFavorites(){
  const list = loadFavorites();
  const card = $('favorites-card');
  if (!list.length){
    card.innerHTML = '<div class="favorites-empty">' + I18N.t('favoritesEmpty') + '</div>';
    return;
  }
  card.innerHTML = list.map(fav => {
    const p = PRODUCTS.find(x => x.id === fav.productId);
    const accent = p ? p.accent.color : 'var(--amber)';
    const available = p && !p.disabled;
    return `
      <div class="fav-item" style="--accent:${accent}">
        <div class="fav-info">
          <div class="fav-name">${escapeHTML(fav.name)}</div>
          <div class="fav-meta">
            ${p ? escapeHTML(p.label) : escapeHTML(I18N.t('favUnavailable'))}
            ${available ? ' · ' + escapeHTML(favSummary(p, fav)) : ''}
          </div>
        </div>
        <div class="fav-actions">
          ${available ? `<button type="button" class="chip" data-load="${fav.id}">${I18N.t('load')}</button>` : ''}
          <button type="button" class="chip fav-delete" data-del="${fav.id}" aria-label="${I18N.t('remove')}">&times;</button>
        </div>
      </div>`;
  }).join('');
}

function openFavorites(){
  renderFavorites();
  // hide product panels, show favorites (not a hash-persisted tab)
  document.querySelectorAll('.tabpanel').forEach(el => el.classList.remove('active'));
  const panel = $('panel-favorites');
  panel.hidden = false;
  panel.classList.add('active');
  $('favorites-btn').classList.add('active');
  $('favorites-btn').setAttribute('aria-expanded', 'true');
  // the language toggle reloads the page: remember the pane was open so the
  // boot code below can reopen it (sessionStorage survives a reload, but a
  // new visit starts with the pane closed)
  try { sessionStorage.setItem('sd_fav_open', '1'); } catch (e) {}
}

function hideFavorites(){
  const panel = $('panel-favorites');
  panel.hidden = true;
  panel.classList.remove('active');
  $('favorites-btn').classList.remove('active');
  $('favorites-btn').setAttribute('aria-expanded', 'false');
  try { sessionStorage.removeItem('sd_fav_open'); } catch (e) {}
  // leaving the favorites pane (or switching product tabs) extinguishes the
  // star: it only stays lit while the saved/loaded favorite stays on screen
  if (litFav) setStarLit(litFav, false);
}

function closeFavorites(){
  hideFavorites();
  // restore the tab strip's active tab
  const tab = document.querySelector('.tab.active');
  if (tab){
    const panel2 = document.getElementById('panel-' + tab.dataset.tab);
    if (panel2) panel2.classList.add('active');
  }
}

$('favorites-btn').addEventListener('click', () => {
  if ($('favorites-btn').classList.contains('active')) closeFavorites();
  else openFavorites();
});

// boot: reopen the favorites pane if it was open when the page (re)loaded,
// e.g. after switching language, which goes through a full page reload
try { if (sessionStorage.getItem('sd_fav_open') === '1') openFavorites(); } catch (e) {}

$('favorites-card').addEventListener('click', e => {
  const loadBtn = e.target.closest('[data-load]');
  if (loadBtn){
    const fav = loadFavorites().find(f => f.id === loadBtn.dataset.load);
    const p = fav && PRODUCTS.find(x => x.id === fav.productId);
    if (fav && p && !p.disabled){
      closeFavorites();
      // switch to the product's tab
      document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.tab === p.id));
      document.querySelectorAll('#panels .tabpanel').forEach(el => el.classList.remove('active'));
      $('panel-' + p.id).classList.add('active');
      applyProductState(p, fav);
      // loaded from favorites -> its star stays lit on this product
      setStarLit(p.id, true);
      showToast(I18N.t('favoriteLoaded'));
    }
    return;
  }
  const delBtn = e.target.closest('[data-del]');
  if (delBtn){
    const removed = loadFavorites().find(f => f.id === delBtn.dataset.del);
    if (removed && litFav === removed.productId) setStarLit(removed.productId, false);
    saveFavorites(loadFavorites().filter(f => f.id !== delBtn.dataset.del));
    renderFavorites();
    showToast(I18N.t('favoriteDeleted'));
  }
});

// star buttons: open the name dialog for that product
document.querySelectorAll('.fav-star').forEach(btn => {
  btn.addEventListener('click', () => {
    favEditProduct = PRODUCTS.find(p => p.id === btn.id.replace('-fav-star', ''));
    if (!favEditProduct || favEditProduct.disabled) return;
    const W = round(parseFloat($(favEditProduct.id + '-weight').value));
    favNameInput.value = favEditProduct.label + ' · ' + W + ' g';
    favOverlay.hidden = false;
    favNameInput.focus();
    favNameInput.select();
  });
});

function closeFavDialog(){ favOverlay.hidden = true; favEditProduct = null; }

$('fav-cancel').addEventListener('click', closeFavDialog);
favOverlay.addEventListener('click', e => { if (e.target === favOverlay) closeFavDialog(); });
document.addEventListener('keydown', e => {
  if (e.key === 'Escape'){
    if (!favOverlay.hidden) closeFavDialog();
    else if ($('favorites-btn').classList.contains('active')) closeFavorites();
  }
});

$('fav-form').addEventListener('submit', e => {
  e.preventDefault();
  if (!favEditProduct) return;
  const name = favNameInput.value.trim() ||
    (favEditProduct.label + ' · ' + round(parseFloat($(favEditProduct.id + '-weight').value)) + ' g');
  const fav = Object.assign(
    { id: 'fav-' + Date.now(), name: name, productId: favEditProduct.id, savedAt: Date.now() },
    captureProductState(favEditProduct)
  );
  const list = loadFavorites();
  list.push(fav);
  saveFavorites(list);
  const savedPid = favEditProduct.id; // closeFavDialog() clears favEditProduct
  closeFavDialog();
  setStarLit(savedPid, true);
  showToast(I18N.t('favoriteSaved'));
});

// ---------- share ----------
const shareToast = document.getElementById('share-toast');
const shareAppBtn = document.getElementById('share-app');
function showToast(msg){
  shareToast.textContent = msg;
  shareToast.classList.add('show');
  if (shareToast._t) clearTimeout(shareToast._t);
  shareToast._t = setTimeout(()=>shareToast.classList.remove('show'), 2200);
}
function isSmartphone(){
  const ua = navigator.userAgent || '';
  const mobilePhoneUA = /Android|iPhone|iPad|iPod|Windows Phone|Mobile/i.test(ua);
  const hasCoarsePointer = window.matchMedia && window.matchMedia('(pointer: coarse)').matches;
  const narrowViewport = window.matchMedia && window.matchMedia('(max-width: 900px)').matches;
  // Any one signal is enough: some phones/iPads/webviews don't report all of them.
  return mobilePhoneUA || hasCoarsePointer || narrowViewport;
}

// Share only where the native share sheet can work. If navigator.share is missing
// the button is hidden (no WhatsApp-style fallbacks; opting out is a clean no).
const enableNativeShare = isSmartphone() && !!navigator.share;
if (!enableNativeShare){
  shareAppBtn.style.display = 'none';
} else {
  shareAppBtn.addEventListener('click', async ()=>{
    if (!navigator.share){
      showToast(I18N.t('shareUnavailable'));
      return;
    }

    const url = location.href.split('#')[0];
    const text = I18N.t('shareText');

    try {
      await navigator.share({ title:I18N.t('shareTitle'), text, url });
    } catch (err) {
      // Dismissing the share sheet (AbortError) is a normal no-op.
      // Never open fallback channels (e.g. WhatsApp) on cancel or failure.
      if (err && err.name === 'AbortError') return;
      showToast(I18N.t('shareFailed'));
    }
  });
}

// ---------- tabs ----------
document.querySelectorAll('.tab').forEach(tab=>{
  tab.addEventListener('click', ()=>{
    // selecting a product tab also closes the favorites pane, so the
    // ★ chip doesn't stay lit (and its next click would otherwise "cancel")
    hideFavorites();
    document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
    document.querySelectorAll('.tabpanel').forEach(p=>p.classList.remove('active'));
    tab.classList.add('active');
    document.getElementById('panel-'+tab.dataset.tab).classList.add('active');
    tab.scrollIntoView({block:'nearest', inline:'nearest', behavior:'smooth'});
    // Keep the URL hash in sync, so any reload (e.g. the language toggle) restores
    // this tab rather than falling back to the first product. Disabled ("soon")
    // tabs are placeholders, so they never drive the persisted tab.
    if (!tab.classList.contains('tab-soon')) {
      try { history.replaceState(null, '', '#' + tab.dataset.tab); } catch (e) {}
    }
  });
});

// only show the edge fades on the tab strip when there's more to scroll to
const tabsWrap = document.querySelector('.tabs-wrap');
const tabsEl = document.querySelector('.tabs');
function updateTabFades(){
  const canLeft = tabsEl.scrollLeft > 2;
  const canRight = tabsEl.scrollLeft + tabsEl.clientWidth < tabsEl.scrollWidth - 2;
  tabsWrap.classList.toggle('can-scroll-left', canLeft);
  tabsWrap.classList.toggle('can-scroll-right', canRight);
}
tabsEl.addEventListener('scroll', updateTabFades);
window.addEventListener('resize', updateTabFades);
updateTabFades();

// ---------- i18n boot ----------
// Static [data-i18n] markup, <title> and meta description follow the active
// language; the lang-chip toggles en <-> nl (persisted in localStorage).
document.documentElement.lang = I18N.lang();
document.title = I18N.t('title');
var metaDescEl = document.querySelector('meta[name="description"]');
if (metaDescEl) metaDescEl.setAttribute('content', I18N.t('metaDesc'));
I18N.apply(document);
I18N.wireFlags(document);

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js'));
}
</script>
</body>
</html>
